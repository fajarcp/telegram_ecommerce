<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B.Laban | Delivery</title>
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-dark: #1c1c1c;
            --text-muted: #7e7e7e;
            --border-color: #f0f0f5;
            --blue-accent: #0050ff; /* Swatch Blue */
            --green-success: #16b33c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-bottom: 100px;
        }

        /* Swiggy-Style Header */
        .header {
            padding: 15px 15px 5px;
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--blue-accent);
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }

        /* Sticky Horizontal Categories */
        .categories {
            display: flex;
            overflow-x: auto;
            padding: 15px;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 55px; /* Sits right under header */
            z-index: 20;
            gap: 20px;
        }

        .categories::-webkit-scrollbar { display: none; }

        .tab {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            padding-bottom: 8px;
            position: relative;
        }

        .tab.active {
            color: var(--text-dark);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--blue-accent);
            border-radius: 3px 3px 0 0;
        }

        /* Menu Container & Items */
        .menu-container {
            padding: 0 15px;
        }

        .category-title {
            font-size: 18px;
            font-weight: 800;
            margin: 25px 0 15px;
            color: var(--text-dark);
        }

        .item-card {
            display: flex;
            justify-content: space-between;
            padding: 20px 0;
            border-bottom: 1px dashed #e4e4e4;
            gap: 15px;
        }

        .item-info {
            flex: 1;
        }

        .item-type {
            font-size: 10px;
            color: var(--blue-accent);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .item-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 6px;
        }

        .price {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        /* Swiggy-Style Image & Add Button */
        .item-media {
            position: relative;
            width: 110px;
            height: 110px;
        }

        .item-img {
            width: 110px;
            height: 110px;
            border-radius: 12px;
            object-fit: cover;
            background-color: #f8f8f8;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* The overlapping ADD button */
        .add-btn-wrapper {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 36px;
            background: #fff;
            border: 1px solid #e2e2e7;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.2s;
        }

        .btn-add-text {
            color: var(--blue-accent);
            font-weight: 800;
            font-size: 14px;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-controls {
            display: none;
            width: 100%;
            height: 100%;
            background: #fff;
            justify-content: space-between;
            align-items: center;
        }

        .add-btn-wrapper.active {
            border-color: var(--blue-accent);
            background: #f4f7ff;
        }

        .add-btn-wrapper.active .btn-add-text { display: none; }
        .add-btn-wrapper.active .btn-controls { display: flex; }

        .ctrl-btn {
            width: 30px;
            height: 100%;
            background: transparent;
            border: none;
            color: var(--blue-accent);
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .ctrl-qty {
            font-size: 14px;
            font-weight: 700;
            color: var(--blue-accent);
        }

        /* Swiggy Style Checkout Bar */
        .checkout-bar {
            position: fixed;
            bottom: 20px;
            left: 15px;
            right: 15px;
            background: var(--blue-accent);
            color: #fff;
            border-radius: 12px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform: translateY(150%);
            transition: transform 0.3s ease;
            z-index: 50;
            box-shadow: 0 8px 20px rgba(0, 80, 255, 0.3);
            cursor: pointer;
        }

        .checkout-bar.visible {
            transform: translateY(0);
        }

        .cart-details {
            display: flex;
            flex-direction: column;
        }

        .cart-items-text { font-size: 12px; font-weight: 600; opacity: 0.9; }
        .cart-total-text { font-size: 16px; font-weight: 800; }
        
        .checkout-action {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>

        let cart = {}; // Master Cart state
        let itemDetails = {}; // Quick lookup map

        function renderApp() {
            const navContainer = document.getElementById('categoryNav');
            const menuContainer = document.getElementById('menuContainer');
            
            navContainer.innerHTML = '';
            menuContainer.innerHTML = '';

            menuData.forEach((cat, index) => {
                // 1. Build Category Navigation Tabs
                const tab = document.createElement('div');
                tab.className = `tab ${index === 0 ? 'active' : ''}`;
                tab.innerText = cat.category;
                tab.onclick = () => scrollToCategory(`cat-${index}`);
                navContainer.appendChild(tab);

                // 2. Build Menu Sections
                const section = document.createElement('div');
                section.id = `cat-${index}`;
                
                const title = document.createElement('h2');
                title.className = 'category-title';
                title.innerText = cat.category;
                section.appendChild(title);

                // 3. Build Items
                cat.items.forEach(item => {
                    itemDetails[item.id] = item; // Save for cart reference
                    
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `
                        <div class="item-info">
                            <div class="item-type">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>
                                B.LABAN
                            </div>
                            <div class="item-title">${item.name}</div>
                            <div class="price">${item.price} EGP</div>
                        </div>
                        <div class="item-media">
                            <img src="${cat.image}" class="item-img" onclick="window.open('${item.search}', '_blank')" alt="${item.name}">
                            <div class="add-btn-wrapper" id="btn-wrap-${item.id}">
                                <div class="btn-add-text" onclick="updateCart('${item.id}', 1)">ADD</div>
                                <div class="btn-controls">
                                    <button class="ctrl-btn" onclick="updateCart('${item.id}', -1)">-</button>
                                    <span class="ctrl-qty" id="qty-${item.id}">0</span>
                                    <button class="ctrl-btn" onclick="updateCart('${item.id}', 1)">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                    section.appendChild(card);
                });

                menuContainer.appendChild(section);
            });
        }

        function scrollToCategory(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' });
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }

        function updateCart(itemId, change) {
            if (!cart[itemId]) cart[itemId] = 0;
            
            let newQty = cart[itemId] + change;
            if (newQty < 0) newQty = 0;
            cart[itemId] = newQty;

            // Update UI for the ADD button
            const wrap = document.getElementById(`btn-wrap-${itemId}`);
            const qtyDisplay = document.getElementById(`qty-${itemId}`);
            
            qtyDisplay.innerText = newQty;
            
            if (newQty > 0) {
                wrap.classList.add('active');
            } else {
                wrap.classList.remove('active');
                delete cart[itemId];
            }

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            refreshCartUI();
        }

        function refreshCartUI() {
            let totalAmount = 0;
            let totalItems = 0;

            for (let id in cart) {
                totalAmount += (itemDetails[id].price * cart[id]);
                totalItems += cart[id];
            }

            document.getElementById('cartTotalDisplay').innerText = totalAmount + ' EGP';
            document.getElementById('cartItemsDisplay').innerText = totalItems + (totalItems === 1 ? ' ITEM' : ' ITEMS');

            const cartBar = document.getElementById('cartBar');
            if (totalItems > 0) {
                cartBar.classList.add('visible');
            } else {
                cartBar.classList.remove('visible');
            }
        }

        function checkout() {
            let totalAmount = 0;
            let orderSummary = [];

            for (let id in cart) {
                const item = itemDetails[id];
                orderSummary.push(`${cart[id]}x ${item.name}`);
                totalAmount += (item.price * cart[id]);
            }

            if (orderSummary.length === 0) return;

            const orderData = {
                items: orderSummary.join('\n'),
                total: totalAmount + ' EGP'
            };

            tg.sendData(JSON.stringify(orderData));
        }

        // Initialize App
        renderApp();
    </script>
</body>
</html>
